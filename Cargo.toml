[package]
name = "rtm"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossterm = "0.29"
dirs = "6"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = "0.25"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["json"] }
